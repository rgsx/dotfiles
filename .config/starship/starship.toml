# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Starship Config
add_newline = false
command_timeout = 2000
scan_timeout = 2000
format = """
($cmd_duration\n)\
($directory)($fill)\
(($git_branch)($git_commit)(${custom.giturl})($git_state)($git_status))\
((${custom.divider})($bun)($package)($nodejs)(${custom.angular})($lua)($all))\
(($sudo)$character)
"""
continuation_prompt = '󰄾 '

[character]
success_symbol = '[›](white)'
error_symbol = '[›](red)'

[fill]
symbol = ' '

[directory]
read_only = "󰉐 "
truncation_length = 4
truncate_to_repo = true
truncation_symbol = '  '
style = "none"
home_symbol = "~"
use_logical_path = true
format = "$path"

[directory.substitutions]
'/' = ' ›   '

[cmd_duration]
show_milliseconds = false
disabled = false
format = "󰚭 $duration"
show_notifications = false

[sudo]
symbol = '󰋙 '
format = "$symbol(white)"
disabled = false

[nodejs]
symbol = '󰎙 '
version_format = 'v${raw}'
format = '$symbol$version(white) '

[package]
symbol = ' '
version_format = 'v${raw}'
format = '$symbol$version(white) '

[bun]
symbol = ' '
version_format = 'v${raw}'
format = '$symbol$version(white) '

[gcloud]
symbol = ' '
format = 'on [$symbol$account(@$domain)(\($project\))](white bold) '

[aws]
symbol = ' '

[azure]
symbol = ' '

[docker_context]
symbol = '󰡨 '
only_with_files = true
format = '[$symbol$context](white bold)'

[openstack]
symbol = ' '
format = 'on [$symbol$account(@$domain)(\($project\))](white bold)'

[java]
symbol = ' '
version_format = 'v${raw}'
format = '$symbol$version(white)'

[kubernetes]
symbol = '󱃾 '

[container]
symbol = ' '

[c]
symbol = ' '
version_format = 'v${raw}'
format = '$symbol$version(white)'

[cpp]
symbol = ' '
version_format = 'v${raw}'
format = '$symbol$version(white)'

[lua]
symbol = ' '
version_format = 'v${raw}'
format = '$symbol$version(white) '

[perl]
symbol = ' '
version_format = 'v${raw}'
format = '$symbol$version(white)'

[php]
symbol = ' '
version_format = 'v${raw}'
format = '$symbol$version(white)'

[ruby]
symbol = ' '
version_format = 'v${raw}'
format = '$symbol$version(white)'

[swift]
symbol = ' '
version_format = 'v${raw}'
format = '$symbol$version(white)'

[dart]
symbol = '  '
version_format = 'v${raw}'
format = '$symbol$version(white)'

[golang]
symbol = '󰟓 '
version_format = 'v${raw}'
format = '$symbol$version(white) '

[rust]
symbol = ' '
version_format = 'v${raw}'
format = '$symbol$version(white) '

[python]
symbol = ' '
version_format = 'v${raw}'
format = '$symbol$version(white) '

[cmake]
symbol = ' '
version_format = 'v${raw}'
format = '$symbol$version(white)'

[custom.divider]
description = "test for a divider"
require_repo = true
command = 'echo "|"'
format = "( $output )"
detect_files = ["package.json", "angular.json", "bun.lockb", "node_modules"]

[custom.angular]
description = 'angular version support'
require_repo = true
when = """
grep -q '"@angular/core"' package.json && exit 0 || exit 1
"""
shell = ["bash", "--noprofile", "--norc"]
command = """
cat package.json | grep '"@angular/core"' | awk -F: '{ gsub(/[^0-9.]/, "", $2); print $2 }'
"""
format = "(󰚲 v$output )"

[git_status]
format = '[($all_status)](bold)'

[git_state]
format = '([$state( $progress_current/$progress_total)](white))'

[git_branch]
symbol = " "
format = '(on [$branch ](bold)$symbol)'

[git_commit]
format = "[ $hash  $tag](white)"

[custom.giturl]
# disabled = true
description = "Display symbol for remote Git server"
command = """
set -e

cache_file="/tmp/starship_giturl_$(pwd | tr '/' '_').cache"
if [ -f "$cache_file" ] && [ $(( $(date +%s) - $(stat -f %m "$cache_file" 2>/dev/null || stat -c %Y "$cache_file" 2>/dev/null || echo 0) )) -lt 60 ]; then
  cat "$cache_file"
  exit 0
fi

url="$(git config --get remote.origin.url 2>/dev/null || git ls-remote --get-url 2>/dev/null || true)"
[ -z "$url" ] && exit 1

case "$url" in
  *://*)
    host="${url#*://}"
    host="${host%%/*}"
    ;;
  *)
    host="${url%%:*}"
    ;;
esac
host="${host#*@}"
host="$(printf '%s' "$host" | tr '[:upper:]' '[:lower:]')"

[ -z "$host" ] && exit 1

symbol=' '
remote_host=''

case "$host" in
  github.com|*.github.com|github.*|*github|github*|*github*)
    symbol=' '
    remote_host='GitHub '
    ;;
  gitlab.com|*.gitlab.com|gitlab.*|*gitlab)
    symbol=' '
    remote_host='GitLab '
    ;;
  bitbucket.org|*.bitbucket.*)
    symbol=' '
    remote_host='Bitbucket '
    ;;
  codeberg.org|*.codeberg.*|gitea.*|*.gitea.*|forgejo.*|*.forgejo.*)
    symbol=' '
    remote_host='Gitea '
    ;;
  sr.ht|*.sr.ht|sourcehut.org|*.sourcehut.org)
    symbol=' '
    remote_host='SourceHut '
    ;;
  dev.azure.com|*.visualstudio.com|azure.*)
    symbol=' '
    remote_host='Azure DevOps '
    ;;
  codecommit.*.amazonaws.com|*.codecommit.*)
    symbol=' '
    remote_host='AWS CodeCommit '
    ;;
  *gtec|gtec*|*gtec*)
    symbol=''
    remote_host='𝗚𝗧𝗘𝗖'
    ;;
  *git*)
    symbol=' '
    remote_host="$host "
    ;;
esac

printf "%s" "$remote_host$symbol" > "$cache_file"
printf "%s" "$remote_host$symbol"
"""
require_repo = true
shell = ["bash", "--noprofile", "--norc"]
format = "(at [$output ](bold) )"
detect_files = [".gitignore"]
detect_folders = [".git"]
