# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Starship Config
add_newline = false

format = """
($cmd_duration\n)\
($directory)($fill)\
(($git_branch)($git_commit)(${custom.giturl})($git_state)($git_status))\
((${custom.divider})($bun)($package)($nodejs)(${custom.angular})($lua)($all))\
(($sudo)$character)
"""
continuation_prompt = '󰄾 '

[character]
success_symbol = '[›](white)'
error_symbol = '[›](red)'

[fill]
symbol = ' '

[directory]
read_only = "󰉐 "
truncation_length = 4
truncate_to_repo = true
truncation_symbol = '  '
style = "none"
home_symbol = "~"
use_logical_path = true
format = "$path"

[directory.substitutions]
'/' = ' ›   '

[cmd_duration]
show_milliseconds = false
disabled = false
format = "󰚭 $duration"
show_notifications = false

[sudo]
symbol = '󰋙 '
format = "$symbol(white)"
disabled = false

[nodejs]
symbol = '󰎙 '
version_format = 'v${raw}'
format = '$symbol$version(white) '

[package]
symbol = ' '
version_format = 'v${raw}'
format = '$symbol$version(white) '

[bun]
symbol = ' '
version_format = 'v${raw}'
format = '$symbol$version(white) '

[gcloud]
symbol = ' '
format = 'on [$symbol$account(@$domain)(\($project\))](white bold) '

[aws]
symbol = ' '

[azure]
symbol = ' '

[docker_context]
symbol = '󰡨 '
only_with_files = true
format = '[$symbol$context](white bold)'

[openstack]
symbol = ' '
format = 'on [$symbol$account(@$domain)(\($project\))](white bold)'

[java]
symbol = ' '
version_format = 'v${raw}'
format = '$symbol$version(white)'

[kubernetes]
symbol = '󱃾 '

[container]
symbol = ' '

[c]
symbol = ' '
version_format = 'v${raw}'
format = '$symbol$version(white)'

[cpp]
symbol = ' '
version_format = 'v${raw}'
format = '$symbol$version(white)'

[lua]
symbol = ' '
version_format = 'v${raw}'
format = '$symbol$version(white) '

[perl]
symbol = ' '
version_format = 'v${raw}'
format = '$symbol$version(white)'

[php]
symbol = ' '
version_format = 'v${raw}'
format = '$symbol$version(white)'

[ruby]
symbol = ' '
version_format = 'v${raw}'
format = '$symbol$version(white)'

[swift]
symbol = ' '
version_format = 'v${raw}'
format = '$symbol$version(white)'

[dart]
symbol = '  '
version_format = 'v${raw}'
format = '$symbol$version(white)'

[golang]
symbol = '󰟓 '
version_format = 'v${raw}'
format = '$symbol$version(white) '

[rust]
symbol = ' '
version_format = 'v${raw}'
format = '$symbol$version(white) '

[python]
symbol = ' '
version_format = 'v${raw}'
format = '$symbol$version(white) '

[cmake]
symbol = ' '
version_format = 'v${raw}'
format = '$symbol$version(white)'

[custom.divider]
description = "test for a divider"
require_repo = true
command = 'echo "|"'
format = "( $output )"
detect_files = ["package.json", "angular.json", "bun.lockb", "node_modules"]

[custom.angular]
description = 'angular version support'
require_repo = true
when = """
grep -q '"@angular/core"' package.json && exit 0 || exit 1
"""
shell = ["bash", "--noprofile", "--norc"]
command = """
cat package.json | grep '"@angular/core"' | awk -F: '{ gsub(/[^0-9.]/, "", $2); print $2 }'
"""
format = "(󰚲 v$output )"

[git_status]
format = '[($all_status)](bold)'

[git_state]
format = '([$state( $progress_current/$progress_total)](white))'

[git_branch]
symbol = " "
format = '(on [$branch ](bold)$symbol)'

[git_commit]
format = "[ $hash  $tag](white)"

[custom.giturl]
# disabled = true
description = "Display symbol for remote Git server"
command = """
set -e

cache_file="/tmp/starship_giturl_$(git rev-parse --git-dir 2>/dev/null | tr '/' '_').cache"
if [ -f "$cache_file" ] && [ "$(find "$cache_file" -mmin -1 2>/dev/null)" ]; then
  cat "$cache_file"
  exit 0
fi

# Prefer the 'origin' remote; fall back to any configured URL.
url="$(git config --get remote.origin.url 2>/dev/null || git ls-remote --get-url 2>/dev/null || true)"
[ -z "$url" ] && exit 1

# Extract host from SSH/HTTPS/CodeCommit/scp-like URLs
if printf %s "$url" | grep -qE '^[a-z]+://'; then
  host="$(printf %s "$url" | sed -E 's|^[a-z]+://([^/]+)/.*|\\1|')"
else
  # scp-like (git@host:owner/repo.git) or similar
  host="$(printf %s "$url" | sed -E 's|^[^@]+@([^:/]+)[:/].*|\\1|')"
fi
host="$(printf %s "$host" | tr '[:upper:]' '[:lower:]')"

# Default generic VCS glyph
symbol=' '
remote_host=''

case "$host" in
  github.com|*.github.com|github.*)
    symbol=' '
    remote_host='GitHub '
    ;;
  gitlab.com|*.gitlab.com|gitlab.*)
    symbol=' '
    remote_host='GitLab '
    ;;
  bitbucket.org|*.bitbucket.*)
    symbol=' '
    remote_host='Bitbucket '
    ;;
  codeberg.org|*.codeberg.*|gitea.*|*.gitea.*|forgejo.*|*.forgejo.*)
    # Gitea/Forgejo/Codeberg share similar lineage; reuse the Gitea glyph
    symbol=' '
    remote_host='Gitea '
    ;;
  sr.ht|*.sr.ht|sourcehut.org|*.sourcehut.org)
    # SourceHut (approximate icon)
    symbol=' '
    remote_host='SourceHut '
    ;;
  dev.azure.com|*.visualstudio.com|azure.*)
    # Azure DevOps
    symbol=' '
    remote_host='Azure DevOps '
    ;;
  codecommit.*.amazonaws.com|*.codecommit.*)
    # AWS CodeCommit (approximate using AWS glyph)
    symbol=' '
    remote_host='AWS CodeCommit '
    ;;
  *)
    # As a fallback, if the host contains 'git', show a generic Git logo
    case "$host" in
      *gtec*)
        symbol=''
        remote_host='𝗚𝗧𝗘𝗖'
        ;;
      *git*)
        symbol=' '
        remote_host="$host "
        ;;
    esac
    ;;
esac

printf "%s" "$remote_host$symbol"
"""
require_repo = true
shell = ["bash", "--noprofile", "--norc"]
format = "(at [$output ](bold))"
detect_files = [".gitignore"]
detect_folders = [".git"]
